<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel World</title><style>:root{color-scheme:dark;--bg:#08080d;--panel:#11111b;--purple:#8b5cf6;--purple-dark:#5b21b6;--text:#f5f3ff;--muted:#aaa4bd}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#1b1230 0,var(--bg) 48%);color:var(--text);font-family:system-ui,Arial,sans-serif}main{width:min(100%,560px);display:flex;flex-direction:column;align-items:center;gap:18px}h1{margin:0;font-size:clamp(28px,7vw,42px);letter-spacing:.04em}h1 span{color:#b9a0ff}.subtitle{margin:-10px 0 0;color:var(--muted);text-align:center}.frame{width:min(88vw,420px);aspect-ratio:1;padding:8px;border:1px solid #7c3aed;border-radius:14px;background:#0e0b17;box-shadow:0 0 36px #6d28d933}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;border-radius:6px}button{width:min(100%,300px);padding:15px 22px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:white;font-size:17px;font-weight:750;cursor:pointer;box-shadow:0 7px 22px #5b21b644}button:active{transform:scale(.98)}.stats{width:min(100%,420px);display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--panel);border:1px solid #292338;border-radius:12px;padding:13px;min-width:0}.label{color:var(--muted);font-size:12px;margin-bottom:5px}.value{font-weight:750;font-size:19px;overflow-wrap:anywhere}.wide{grid-column:1 / -1}.note{max-width:440px;color:var(--muted);text-align:center;font-size:13px;line-height:1.5}code{color:#c4b5fd}</style></head><body><main><h1>PIXEL <span>WORLD</span></h1><p class="subtitle">100 × 100 pixels</p><div class="frame"><canvas id="canvas" width="100" height="100" aria-label="Ảnh pixel màu ngẫu nhiên"></canvas></div><button id="change">↻ Thay đổi tất cả pixel</button><section class="stats" aria-live="polite"><div class="stat"><div class="label">Số lần bấm</div><div class="value" id="clicks">0</div></div><div class="stat"><div class="label">Số pixel</div><div class="value">10.000</div></div><div class="stat wide"><div class="label">Màu của pixel được trỏ gần nhất</div><div class="value" id="color">#------</div></div></section></main><script> const canvas=document.getElementById("canvas");const ctx=canvas.getContext("2d",{alpha:false});const button=document.getElementById("change");const clicksLabel=document.getElementById("clicks");const colorLabel=document.getElementById("color");const SIZE=100;let clicks=0;function randomizePixels(){const image=ctx.createImageData(SIZE,SIZE);const data=image.data;for (let i=0;i < data.length;i +=4){data[i]=Math.floor(Math.random() * 256);data[i + 1]=Math.floor(Math.random() * 256);data[i + 2]=Math.floor(Math.random() * 256);data[i + 3]=255}ctx.putImageData(image,0,0);clicks++;clicksLabel.textContent=clicks.toLocaleString("vi-VN");colorLabel.textContent="#RANDOM"}canvas.addEventListener("pointermove",(event)=>{const rect=canvas.getBoundingClientRect();const x=Math.max(0,Math.min(SIZE - 1,Math.floor((event.clientX - rect.left) / rect.width * SIZE)));const y=Math.max(0,Math.min(SIZE - 1,Math.floor((event.clientY - rect.top) / rect.height * SIZE)));const pixel=ctx.getImageData(x,y,1,1).data;const hex="#" + [...pixel].slice(0,3).map(v=> v.toString(16).padStart(2,"0")).join("");colorLabel.textContent=hex.toUpperCase()});button.addEventListener("click",randomizePixels);randomizePixels();clicks=0;clicksLabel.textContent="0";</script></body></html>
